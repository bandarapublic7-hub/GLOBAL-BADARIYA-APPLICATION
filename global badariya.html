<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Campus App</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--red:#e01e26;--sal:#f7a692;--pink:#fde4e1;--bg:#fcf6fa;--pbg:#fdf1ef;--card:#fff;--tx:#2f3a4a;--mut:#6b7280;--sk:#e8e4e6;--ln:#e6d9d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center}
button{font:inherit;cursor:pointer}
#app{position:relative;width:100%;max-width:min(560px,calc(100vh*.47));height:100%;overflow:hidden;overflow:clip;background:var(--bg);--d:1}
#top{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 4px) 14px 4px;height:calc(56px + env(safe-area-inset-top,0px))}
#top button{background:none;border:0;color:#fff;padding:6px}
.wm{font-weight:900;font-style:italic;letter-spacing:-.5px;line-height:1;text-align:center}
.wm small{display:block;font:700 6px Roboto;font-style:normal;letter-spacing:0;margin-top:2px}
.brand-logo{display:block;object-fit:contain}
#hw .brand-logo{width:98px;height:56px}
#dw .brand-logo{width:190px;height:auto;margin-bottom:20px}
.pg{position:absolute;inset:0;overflow-y:auto;padding-bottom:100px;display:none}
.pg.on{display:block;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateX(calc(var(--d)*36px))}}
#home{padding-top:calc(56px + env(safe-area-inset-top,0px))}
.wsw{container-type:inline-size}
.ws{position:relative;height:100cqw;overflow:hidden}
.wh{position:absolute;top:49.5%;width:0;height:0;touch-action:none;user-select:none;-webkit-user-select:none}.wl{left:0}.wr{right:-.9cqw}
.dsk{position:absolute;width:39.3cqw;height:39.3cqw;left:-19.65cqw;top:-19.65cqw;border-radius:50%;background:#fee2e1}
.wr .dsk{width:43.6cqw;height:43.6cqw;left:-21.8cqw;top:-21.8cqw}
.wc{position:absolute;top:-6.5cqw;width:22cqw;color:var(--mut);font-size:3.2cqw;letter-spacing:.2cqw;white-space:nowrap}
.wl .wc{left:-6.8cqw;text-align:right}.wr .wc{right:auto;left:-19.6cqw;text-align:left}
.wc b{display:block;font-size:8.4cqw;color:var(--red);letter-spacing:0;line-height:1.1}
.wheel{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--turn,0deg));transform-origin:0 0;transition:transform .24s cubic-bezier(.2,.75,.25,1);pointer-events:none}
.tl{position:absolute;left:0;top:0;width:20.5cqw;height:10cqw;margin:-5cqw 0 0 -10.25cqw;transform:rotate(var(--a)) translateX(33cqw);background:linear-gradient(#f9b09d,#f5a08a);border-radius:1.2cqw 3cqw 3cqw 1.2cqw;box-shadow:0 0 0 .5cqw #ffffffa0,0 1cqw 2cqw #0003;display:grid;place-items:center;font-size:3.6cqw;color:#40302f;white-space:nowrap;animation:spin .7s both;animation-delay:calc(var(--i)*30ms)}
.tl{pointer-events:auto;cursor:grab}
.tl span{display:block;transform:rotate(var(--f))}
@keyframes spin{from{opacity:0;transform:rotate(calc(var(--a) - 70deg)) translateX(19cqw)}}
.cwo{container-type:inline-size;margin:min(6.6vw,37px) 5% 0;perspective:1200px}
.flip{position:relative;aspect-ratio:2.54;transform-style:preserve-3d;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.fc{position:absolute;inset:0;border-radius:2.5cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 .8cqw 2cqw #0003}
.fr{background:var(--sal);color:#3b2b2b}
.ring{position:absolute;inset:0;background:radial-gradient(circle at 16.1cqw 50%,#fff 0 14.2cqw,var(--red) 14.2cqw 17.9cqw,#fff 17.9cqw 23.6cqw,#0000 23.6cqw)}
.ph{position:absolute;left:1.9cqw;top:calc(50% - 14.2cqw);width:28.4cqw;height:28.4cqw;border-radius:50%;overflow:hidden;border:.9cqw solid #fff}
.avs svg,.avs img{width:100%;height:100%;display:block;object-fit:cover}
.si{position:absolute;left:0;right:4cqw;top:5.1cqw;text-align:right;font-size:4.1cqw;line-height:1.3}
#cc{font-size:3.6cqw}
.pill{margin-left:49cqw;background:#fde9e4;border-radius:5cqw 0 0 5cqw;padding:.8cqw 3cqw;line-height:1.15;text-align:center;font-weight:700;font-size:4.6cqw;margin-right:-4cqw;margin-bottom:1.5cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tap{position:absolute;right:0;bottom:0;width:15.4cqw;height:9.8cqw;background:var(--red);color:#fff;border:0;border-radius:5cqw 0 1.5cqw 5cqw;font-size:4.2cqw;font-weight:500}
.bk2{background:var(--card);transform:rotateX(180deg);padding:3.4cqw 4cqw;font-size:3.7cqw;line-height:1.55;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb{position:absolute;right:3cqw;bottom:2.5cqw;background:none;border:1px solid var(--red);color:var(--red);border-radius:3cqw;padding:.8cqw 3cqw;font-size:3.3cqw}
.sk{background:linear-gradient(100deg,var(--sk) 30%,#ffffff99 50%,var(--sk) 70%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.sks{display:none}.ld>.real{display:none}.ld>.sks{display:block}
#nav{position:absolute;left:0;right:0;bottom:0;z-index:6;height:60px}
#nav .bar{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 -2px 5px #0002)}
#nav .knob{position:absolute;top:-5px;width:44px;height:44px;display:grid;place-items:center;color:#e5326f}
#nav .row{position:absolute;inset:0 0 9px 0;display:grid;grid-template-columns:repeat(4,1fr)}
#nav .row button{background:none;border:0;color:#fff}
#nav .row button.on svg{opacity:0}
#prof{background:var(--pbg);padding-top:env(safe-area-inset-top,0px)}
.t1{padding:16px 16px 6px;font-size:18px}
.hero{position:relative;height:150px;background:var(--card);margin-top:4px}
.hello{position:absolute;right:0;top:0;left:90px;text-align:right;padding:10px 16px;font-size:14px;background:var(--pbg);border-radius:0 0 0 22px;margin:0}
.blob{position:absolute;left:-40px;top:22px;width:200px;height:112px;border-radius:60px;background:#fbd9d6}
.blob::after{content:"";position:absolute;inset:12px 20px 12px 52px;border-radius:50px;background:#fde8e6}
.av{position:absolute;left:22px;top:22px;width:104px;height:104px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 4px #f6c4be;overflow:hidden;z-index:1}
.lk{display:flex;justify-content:space-between;background:var(--card);padding:6px 24px 14px;font-size:12px}
.lk button{background:none;border:0;color:var(--tx);display:flex;gap:4px;align-items:center;padding:0}
.sheet{background:var(--pbg);border-radius:26px 26px 0 0;padding:16px 14px 20px;margin-top:-10px;position:relative}
.tabs{display:flex;gap:26px;justify-content:center}
.tabs button{border:0;border-radius:10px;padding:9px 14px;color:#fff;background:#bdbdbd;box-shadow:0 3px 6px #0003;font-size:13px;transition:background .25s}
.tabs button.on{background:var(--sal)}
.sheet h3{font-weight:500;font-size:17px;margin:18px 0 10px}
.ir{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:0 2px 6px #00000014;color:var(--red)}
.ir small{display:block;color:var(--mut);font-size:11px;letter-spacing:.4px}.ir div{color:var(--tx);font-size:14px;min-height:18px}
.fab{position:absolute;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--sal);color:#fff;border:0;border-radius:14px;padding:10px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 3px 8px #0004;font-size:13px}
#ep{position:absolute;inset:0;z-index:20;background:var(--pbg);overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.3,.8,.3,1)}
#ep.on{transform:none}
.eh{position:sticky;top:0;z-index:2;background:var(--pbg);padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 8px;display:flex;align-items:center;gap:10px}
.bk{width:36px;height:36px;border-radius:50%;border:1px solid var(--red);background:none;color:var(--red);display:grid;place-items:center;flex:none}
.eh h2{margin:0;font-weight:400;flex:1;text-align:center;font-size:var(--fs,32px);padding-right:36px}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 4px;font-size:13px;color:var(--red);cursor:pointer}
.pc .avs{width:88px;height:88px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 3px #f6c4be}
.f{position:relative;margin:12px 16px}
.f input,.f select{width:100%;padding:20px 14px 8px;border:1px solid var(--ln);border-radius:12px;background:var(--card);font:16px Roboto,sans-serif;color:var(--tx);outline:0;height:54px}
.f input:focus,.f select:focus{border-color:var(--red)}
.f label{position:absolute;left:14px;top:6px;font-size:11px;color:var(--mut);pointer-events:none;transition:all .15s}
.f input:placeholder-shown:not(:focus)+label{top:17px;font-size:16px}
.f select{appearance:none;padding-top:22px}
.sub{margin:18px 16px 0;font-size:14px}
.sv{display:block;margin:22px auto;border:0;border-radius:20px;background:#ece6f6;color:#4b3b6b;padding:10px 28px;box-shadow:0 2px 5px #0003}
#dr{position:absolute;inset:0;z-index:30;pointer-events:none}
#dr i{position:absolute;inset:0;background:#0006;opacity:0;transition:opacity .3s}
#dr nav{position:absolute;left:0;top:0;bottom:0;width:78%;background:var(--card);transform:translateX(-100%);transition:transform .3s;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px}
#dr.on{pointer-events:auto}#dr.on i{opacity:1}#dr.on nav{transform:none}
#dr nav a{display:block;padding:14px 4px;border-bottom:1px solid var(--ln);font-size:15px}
#sp{position:absolute;inset:0;z-index:50;background:#fff;display:grid;place-items:center;transition:opacity .5s}
#sp>*{grid-area:1/1}
.mk{width:80px;height:80px;background:var(--red);animation:lg .5s ease both,rd .5s 1s ease forwards,gone .4s 1.9s ease forwards}
.mk svg{width:100%;height:100%}
@keyframes lg{from{opacity:0;transform:scale(.6)}}
@keyframes rd{to{border-radius:18px}}
@keyframes gone{to{opacity:0;transform:scale(.7)}}
.big{color:var(--red);opacity:0;animation:wmi .7s 2.2s ease forwards}
.big .brand-logo{width:min(320px,80vw);height:auto}
@keyframes wmi{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.spin{position:absolute;bottom:70px;width:22px;height:22px;border:2px solid #2b8cf0;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:18px;font-size:13px;z-index:60;animation:in .3s ease both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style></head>

<div id="sp"><div class="mk"></div><div class="big" id="big"></div><div class="spin"></div></div>

<div class="hero"><p class="hello" id="hl"></p><div class="blob"></div><div class="av avs"></div></div>

/* Each wheel owns its drag state and loops around its own arc: items leave the visible half and re-enter from the opposite end. Release with speed and it keeps turning, then settles on a slot. */
document.querySelectorAll('.wh').forEach(wheel=>{const rotor=wheel.querySelector('.wheel'),direction=Number(wheel.dataset.direction),state={pointer:null,turn:0,startY:0,startTurn:0,lastY:0,lastT:0,v:0};
const set=t=>{state.turn=t;rotor.style.setProperty('--turn',t+'deg')};
wheel.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;state.pointer=e.pointerId;state.startY=state.lastY=e.clientY;state.lastT=performance.now();state.v=0;state.startTurn=state.turn;rotor.style.transition='none';wheel.setPointerCapture(e.pointerId)};
wheel.onpointermove=e=>{if(e.pointerId!==state.pointer)return;const radius=wheel.closest('.ws').clientWidth*.33,now=performance.now(),dt=Math.max(now-state.lastT,1),k=direction*180/radius;state.v=.8*state.v+.2*((e.clientY-state.lastY)*k/dt);state.lastY=e.clientY;state.lastT=now;set(state.startTurn+(e.clientY-state.startY)*k)};
const settle=e=>{if(e.pointerId!==state.pointer)return;state.pointer=null;const idle=performance.now()-state.lastT>80,v=idle?0:state.v,fling=Math.max(-720,Math.min(720,v*260));rotor.style.transition=Math.abs(fling)>18?'transform .8s cubic-bezier(.12,.8,.2,1)':'';set(Math.round((state.turn+fling)/18)*18)};

const fl=$('#fl');let side=0,drag=null;fl._r=0;
/* vertical flip: first click turns the card top-to-down (0 -> -180), next click turns it back down-to-up (-180 -> 0) */
function flipTo(b,from){fl._r=b;side=b?1:0;const k=a=>`translateY(0) scale(1) rotateX(${a}deg)`,m=`translateY(-14px) scale(1.06) rotateX(${(from+b)/2}deg)`;fl.animate([{transform:k(from)},{transform:m,offset:.5},{transform:k(b)}],{duration:650,easing:'cubic-bezier(.3,.9,.3,1.08)'});fl.style.transform=k(b)}
const flipAngle=(a,dy)=>Math.max(-180,Math.min(0,a-dy/fl.offsetHeight*180));
fl.onpointerdown=e=>{if(e.target.closest('button'))return;drag={y:e.clientY,a:fl._r,m:0,t:Date.now()};fl.setPointerCapture(e.pointerId)};
fl.onpointermove=e=>{if(!drag)return;const dy=e.clientY-drag.y;drag.m=Math.max(drag.m,Math.abs(dy));fl.style.transform=`rotateX(${flipAngle(drag.a,dy)}deg)`};
fl.onpointerup=e=>{if(!drag)return;const dy=e.clientY-drag.y,now=flipAngle(drag.a,dy),other=drag.a?0:-180;let b=drag.a;if(drag.m<6||Math.abs(now-drag.a)>45)b=other;drag=null;flipTo(b,drag?0:now)};
fl.onpointercancel=()=>{if(!drag)return;const a=drag.a;drag=null;flipTo(a,a)};
$('#tp').onclick=()=>flipTo(fl._r?0:-180,fl._r);

/* profile rows */
let tab='p';
Object.entries({enroll:'0000XX000000',bio:'00000',sem:'5',addr:'City, State',pcontact:'9000000000',cat:'General',adhar:'XXXX XXXX 0000',hob:'',str:'',weak:'',lap:'',p10:'00.0',p12:'00.0',ent:'JEE Main',cgpa:'0.00',back:'0'}).forEach(([k,v])=>{if(D[k]===undefined)D[k]=v});
const rowsP=()=>[['GNo',D.gno],['Biometric Id',D.bio],['Enrollment No',D.enroll],['Fathers Name',D.father],['Mothers Name',D.mother],['D.O.B',D.dob],['Contact No',D.contact],['Course',D.course+' ('+D.branch+')'],['Semester',D.sem],['Address',D.addr],['Parent Contact',D.pcontact],['Email',D.email],['Category',D.cat],['Blood Group',D.blood],['Adhar No',D.adhar],['Samagra Id',D.samagra],['Hobbies',D.hob],['Strength',D.str],['Weakness',D.weak],['Laptop',D.lap]];
const rowsE=()=>[['10th Percentage',D.p10],['12th Percentage',D.p12],['Entrance',D.ent],['Current CGPA',D.cgpa],['Backlogs',D.back]];
/* everything bound to D redraws from here, so editing the profile updates the student card too */
function R(){document.querySelectorAll('.avs').forEach(e=>e.innerHTML=av());$('#cn').textContent=D.name;$('#cg').textContent=D.gno;$('#cc').textContent=`${D.course} ( ${D.branch} )`;$('#rk').textContent=D.rank;$('#at').textContent=D.att;$('#hl').textContent='Hello, '+D.name;
$('#cb').innerHTML=`Father Name: ${D.father}<br>Mother Name: ${D.mother}<br>Date Of Birth: ${D.dob}<br>Contact: ${D.contact}<br>Email: ${D.email}`;
$('#rows').innerHTML=(tab=='p'?rowsP():rowsE()).map(r=>`<div class="ir">${ic('doc',26)}<div><small>${r[0]}</small>${r[1]}</div></div>`).join('')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));R()});
$('#psk').innerHTML=Array(6).fill('<div style="display:flex;gap:14px;margin-bottom:18px"><div class="sk" style="width:40px;height:40px;border-radius:50%"></div><div style="flex:1"><div class="sk" style="height:12px;border-radius:6px"></div><div class="sk" style="height:8px;border-radius:4px;margin-top:8px;width:70%"></div></div></div>').join('');
/* edit profile: every field maps to D, the form refills from D each time it opens, Save writes back to D and redraws every screen */
const F=[['name','Full Name',1],['gno','GNo',1],['course','Course',1],['branch','Branch',1],['father','Father Name'],['mother','Mother Name'],['dob','Date of Birth'],['contact','Contact Number'],['email','Email'],['bio','Biometric Id'],['enroll','Enrollment No'],['sem','Semester'],['addr','Address'],['pcontact','Parent Contact'],['cat','Category'],['adhar','Adhar No'],['samagra','Samagra ID'],['hob','Hobbies'],['str','Strength'],['weak','Weakness'],['lap','Laptop Brand'],['p10','10th Percentage'],['p12','12th Percentage'],['ent','Entrance'],['cgpa','Current CGPA'],['back','Backlogs']];
const fld=([k,l])=>`<div class="f"><input id="f_${k}" placeholder=" "><label>${l}</label></div>`;
const blood=`<div class="f"><select id="f_blood"><option value="">Select Your Blood Group</option>${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(b=>`<option>${b}</option>`).join('')}</select><label>Blood Group</label></div>`;
const at=k=>F.findIndex(f=>f[0]==k);
$('#ef').innerHTML=F.slice(0,at('bio')).map(fld).join('')+blood+F.slice(at('bio'),at('lap')).map(fld).join('')+'<p class="sub">Your Laptop Details Here!!!</p>'+fld(F[at('lap')])+'<p class="sub">Educational Info</p>'+F.slice(at('p10')).map(fld).join('')+'<button class="sv" id="sv">Save</button>';
const ep=$('#ep'),fillForm=()=>{F.forEach(([k])=>$('#f_'+k).value=D[k]||'');$('#f_blood').value=D.blood||''};
const openEdit=()=>{fillForm();ep.scrollTop=0;ep.classList.add('on')},closeEdit=()=>ep.classList.remove('on');
ep.onscroll=()=>ep.style.setProperty('--fs',(32-14*Math.min(ep.scrollTop/50,1))+'px');
$('#ed').onclick=openEdit;$('#bk').onclick=closeEdit;$('#cb').onclick=e=>{if(e.target.id=='eb')openEdit()};
$('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{D.photo=r.result;R()};r.readAsDataURL(f)};
$('#sv').onclick=()=>{const v=k=>$('#f_'+k).value.trim();
for(const [k,l,req] of F)if(req&&!v(k))return toast(l+' is required');
if(v('contact')&&!/^\d{10}$/.test(v('contact')))return toast('Contact must be 10 digits');
if(v('pcontact')&&!/^\d{10}$/.test(v('pcontact')))return toast('Parent contact must be 10 digits');
if(v('email')&&!/^\S+@\S+\.\S+$/.test(v('email')))return toast('Enter a valid email');
F.forEach(([k])=>D[k]=v(k));D.blood=$('#f_blood').value;R();closeEdit();toast('Profile saved')};
$('#cpw').onclick=()=>toast('Change password (demo)');$('#lo').onclick=()=>toast('Logged out (demo)');$('#bl').onclick=()=>toast('No new notifications');
const dr=$('#dr');$('#mn').onclick=()=>dr.classList.add('on');dr.firstElementChild.onclick=()=>dr.classList.remove('on');
/* bottom bar with a notch that slides to the active tab */
const pages=['home','cal','att','prof'],icons=['home','cal','chk','user'];let cur=0,cx=0,seen={};
const nav=$('#nav'),row=nav.querySelector('.row');
row.innerHTML=icons.map((n,i)=>`<button data-i="${i}" aria-label="${pages[i]}">${ic(n)}</button>`).join('');
function draw(c){const w=nav.offsetWidth,h=nav.offsetHeight,y=0,d=44;$('#bsv').setAttribute('viewBox',`0 0 ${w} ${h}`);$('#bp').setAttribute('d',`M0 ${y}H${c-58}C${c-32} ${y} ${c-38} ${y+d} ${c} ${y+d}C${c+38} ${y+d} ${c+32} ${y} ${c+58} ${y}H${w}V${h}H0Z`);$('#kn').style.left=(c-22)+'px'}
function place(anim){const to=(cur+.5)*nav.offsetWidth/4,from=cx,t0=performance.now();[...row.children].forEach((b,i)=>b.classList.toggle('on',i==cur));$('#kn').innerHTML=ic(icons[cur],24);if(!anim){cx=to;draw(cx);return}$('#kn').firstChild.animate([{transform:'scale(.4) rotate(-40deg)'},{transform:'none'}],{duration:380,easing:'ease-out'});(function f(t){const k=Math.min((t-t0)/380,1);cx=from+(to-from)*(1-Math.pow(1-k,3));draw(cx);if(k<1)requestAnimationFrame(f)})(t0)}
function go(i){if(i==cur)return;app.style.setProperty('--d',i>cur?1:-1);cur=i;pages.forEach((p,k)=>$('#'+p).classList.toggle('on',k==i));$('#top').style.display=i==0?'flex':'none';if(i==3&&!seen.p){seen.p=1;$('#prof').classList.add('ld');setTimeout(()=>$('#prof').classList.remove('ld'),1300)}place(1)}
row.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
addEventListener('resize',()=>place(0));
/* boot */
R();$('#home').classList.add('on');place(0);
const done=()=>{const s=$('#sp');if(!s)return;s.style.opacity=0;setTimeout(()=>s.remove(),500);setTimeout(()=>$('#home').classList.remove('ld'),1000)};
setTimeout(done,3600);$('#sp').onclick=done;
</script></body></html>
